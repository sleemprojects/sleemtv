<!doctype html>
<html lang="en">
  <head>
    <!-- stuff -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="sleem.css">
    <title>SleemTV (W.I.P)</title>
    <link rel="icon" type="image/x-icon" href="sleemtvlogo.jpg">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        h1 {
            margin-top: 20px;
        }
        p1 {
            margin-bottom: 20px;
        }
        #video-container {
            width: 80%;
            max-width: 800px;
            margin-top: 20px;
        }
        video {
            width: 100%;
            height: auto;
        }
    </style>
  </head>
  <body>
    <h1>SleemTV</h1>
    <p1>This is a website that streams random news channels (not 24/7)</p1>

    <div id="video-container">
        <video id="sleemtv-video" controls>
            <source src="http://serveo.net:43469/hls/hls.m3u8" type="application/x-mpegURL">
            Your browser does not support the video tag.
        </video>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        window.onload = function() {
            const videoElement = document.getElementById('sleemtv-video');
            const videoSrc = localStorage.getItem('videoSrc') || 'http://serveo.net:43469/hls/hls.m3u8';
            const repeat = localStorage.getItem('repeat') === 'true';

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(videoSrc);
                hls.attachMedia(videoElement);
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = videoSrc;
            }

            videoElement.loop = repeat;
        };
    </script>
  </body>
</html>
